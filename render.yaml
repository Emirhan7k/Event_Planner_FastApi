databases:
  - name: smart-event-planner-db
    databaseName: web_project
    plan: free

services:
  - type: web
    name: smart-event-planner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-event-planner-db
          property: connectionString
      - key: UPLOAD_DIR
        value: static/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: DEBUG
        value: "false"
