services:
  - type: web
    name: smart-event-planner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from pathlib import Path; Path('data').mkdir(exist_ok=True)" && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/event_planner.db
      - key: UPLOAD_DIR
        value: static/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: DEBUG
        value: "false"
