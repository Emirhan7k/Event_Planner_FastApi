<div class="event-card glass-card">
    <img src="{{ event.image_url or 'https://via.placeholder.com/400x200' }}" alt="{{ event.title }}" class="event-image">
    <div class="event-details">
        <span class="event-category">{{ event.category }}</span>
        <h3 class="event-title">{{ event.title }}</h3>
        <div class="event-info">
            <span>{{ event.event_date.strftime('%B %d, %Y') }}</span> • 
            <span>{{ event.location }}</span>
        </div>
        {% if event.score_percent %}
            <div class="recommendation-score" style="color: var(--success); font-weight: 700; font-size: 0.75rem; margin-bottom: 1rem;">
                {{ event.score_percent }}% Match
            </div>
        {% endif %}
        <a href="/events/{{ event.id or event.event_id }}" class="btn btn-outline" style="width: 100%; text-align: center;">View Details</a>
    </div>
</div>
