{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-form glass-card">
        <h2 style="margin-bottom: 2rem; text-align: center;">Welcome Back</h2>
        
        {% if error %}
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.875rem;">
                {{ error }}
            </div>
        {% endif %}

        <form action="/auth/login" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <a href="/auth/register" style="color: var(--primary); text-decoration: none;">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
