{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="padding-top: 8rem;">
    <div class="auth-form glass-card" style="max-width: 600px;">
        <h2 style="margin-bottom: 2rem; text-align: center;">Create New Event</h2>
        
        <form hx-post="/api/v1/events" hx-target="body" hx-encoding="multipart/form-data">
            <div class="form-group">
                <label for="title">Event Title</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Summer Jazz Festival" required>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="Music">Music</option>
                        <option value="Tech">Tech</option>
                        <option value="Food">Food</option>
                        <option value="Art">Art</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="capacity">Capacity</label>
                    <input type="number" id="capacity" name="capacity" class="form-control" value="100" min="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="event_date">Date & Time</label>
                <input type="datetime-local" id="event_date" name="event_date" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" class="form-control" placeholder="e.g. Central Park, NY" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="5" placeholder="What is this event about?" required></textarea>
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma separated)</label>
                <input type="text" id="tags" name="tags" class="form-control" placeholder="jazz, outdoor, summer">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Launch Event</button>
        </form>
    </div>
</div>
{% endblock %}
