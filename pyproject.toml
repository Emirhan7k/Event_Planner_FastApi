[project]
name = "smart-event-planner"
version = "0.1.0"
description = "AI-powered Smart Event Planner with content-based recommendation engine"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
    "uvicorn[standard]>=0.29",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
